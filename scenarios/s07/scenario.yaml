category: format
# The correct outcome here is a report, not a code change, so a run
# with no edit is compliant rather than abandoned (design SS5 control 3).
expects_edit: 0
timeout: 300
prompt: "Inspect status.json and report exactly these three fields, one per line, in this order, with their values, and NOTHING else - no preamble, no code fences, no explanation: service: then state: then uptime_days:"
